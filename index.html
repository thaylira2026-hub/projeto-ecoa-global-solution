<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ecoa+: serviços públicos acessíveis para pessoas surdas e com deficiência auditiva." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet" />
    <title>Ecoa+</title>
    <style>
      /* No celular e no tablet, o ícone azul do VLibras some: o botão "Libras" fica na barra de atalhos embaixo */
      @media (max-width: 1023px) {
        #vlibras-access-wrapper {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras: tradutor gratuito do governo federal (português para Libras) -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      if (window.VLibras) {
        // O VLibras lembra se ficou aberto na última visita e abre sozinho.
        // Aqui marcamos como fechado, para ele só abrir quando a pessoa clicar.
        try {
          var salvo = localStorage.getItem('@vlibras-widget')
          if (salvo) {
            localStorage.setItem('@vlibras-widget', salvo.replace('"isOpen":true', '"isOpen":false'))
          }
        } catch (e) {
        
        }

        new window.VLibras.Widget('https://vlibras.gov.br/app')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
